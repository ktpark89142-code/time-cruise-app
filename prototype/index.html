<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Cruise</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2233;--sub:#6b7491;--line:#e6e9f2;--brand:#3b5bdb;--ok:#2f9e6b;--warn:#e8890c;--bad:#d6455d}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--ink:#e9ecf5;--sub:#8f98b5;--line:#2a3042;--brand:#6c8cff}}
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,"Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{padding:18px 16px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#gear{flex:none;border:0;background:var(--card);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
[hidden]{display:none!important}
.fld{display:block;margin-bottom:12px;font-size:13px}
.fld span{display:block;margin-bottom:4px;color:var(--sub);font-size:12px}
.fld input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit}
.fld small{display:block;margin-top:3px;color:var(--sub);font-size:11px}
.errmsg{color:var(--bad);font-size:12px;margin:2px 0 8px;min-height:16px}
header h1{font-size:20px}
header p{font-size:12px;color:var(--sub);margin-top:2px}
main{flex:1;padding:8px 16px 90px}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--sub);font-size:12px}
nav{position:fixed;bottom:0;width:100%;max-width:440px;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;color:var(--sub);font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--brand);font-weight:700}
.hero{display:flex;gap:12px;align-items:center}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:70px;height:70px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:18px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stat div{background:var(--bg);border-radius:12px;padding:8px 2px}
.stat b{display:block;font-size:16px}
.row{margin-bottom:11px}
.row .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;color:var(--sub);font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.days button{flex:none;width:44px;border:0;border-radius:12px;padding:8px 0;background:var(--card);color:var(--ink);cursor:pointer}
.days button span{display:block;font-size:11px;color:var(--sub)}
.days button.on{background:var(--brand);color:#fff}.days button.on span{color:#dfe6ff}
.slot{display:flex;align-items:stretch;gap:10px;min-height:30px;border-bottom:1px solid var(--line);cursor:pointer}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.slot{touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.brushbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 8px;margin:0 0 6px}
.chips.nowrap{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.chips.nowrap .chip{flex:none;opacity:.55}
.chip.blank{background:var(--card);color:var(--ink);border:1.5px dashed var(--sub)}
.chips.nowrap .chip.on{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.slot.sel{background:color-mix(in srgb,var(--bc,var(--brand)) 28%,transparent);outline:2px solid var(--bc,var(--brand));outline-offset:-2px;border-radius:6px}
.slot .tm{width:42px;font-size:11px;color:var(--sub);padding-top:7px}
.slot .ct{flex:1;display:flex;align-items:center;font-size:13px;padding:2px 8px;margin:3px 0;border-radius:8px}
.slot .ct.e{color:var(--sub);border:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;border-radius:16px;padding:7px 11px;font-size:12px;cursor:pointer;color:#fff}
.fab{position:fixed;right:max(16px,calc(50% - 204px));bottom:76px;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.show{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:16px 16px 28px}
.goalrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.goalrow span:first-child{flex:1}
.step{display:flex;align-items:center;gap:8px}
.step button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.step b{width:28px;text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;margin-top:8px;cursor:pointer}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.li .ic{font-size:22px}.li small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
table.wk{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;min-width:100%}
table.wk th,table.wk td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
table.wk thead th{background:var(--card);font-weight:600}
table.wk th.dt{font-weight:400;color:var(--sub);font-size:11px;padding-top:0}
table.wk .cat{position:sticky;left:0;z-index:2;text-align:left;min-width:96px;max-width:96px;padding-left:6px!important;overflow:hidden;text-overflow:ellipsis;font-weight:600}
table.wk thead .cat{background:var(--card);color:var(--brand);z-index:3}
table.wk thead .cat.sm{font-size:11px;font-weight:400;color:var(--sub)}
table.wk tfoot .cat{background:var(--card);color:var(--ink)}
table.wk tfoot td{font-weight:700;border-bottom:0}
table.wk .tdy{background:color-mix(in srgb,var(--brand) 12%,transparent)}
table.wk .sum{font-weight:700;border-left:1px solid var(--line)}
table.wk .pc{font-weight:700}
table.wk th.dtc{cursor:pointer;background:var(--card)}
table.wk th.dtc.hol{background:color-mix(in srgb,var(--brand) 28%,var(--card));color:var(--ink)}
table.wk th.dtc.now{text-decoration:underline;text-underline-offset:3px}
table.wk tr.mrow th{font-weight:400;color:var(--sub);font-size:11px}
table.wk th.hl{text-align:right;font-weight:400;color:var(--sub)}
table.wk th.hv{color:var(--brand)}
table.wk th.tot{background:color-mix(in srgb,var(--brand) 14%,var(--card))}
table.wk td.tp{color:var(--brand);font-size:13px}
table.wk tfoot td{border-top:2px solid var(--line)}.prow{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:4px}
.prow b{font-size:18px}
.pbar{position:relative;padding:3px 0}
.pbar .bar{height:10px}
.pbar .tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px}
.gap{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
.gap b{font-size:22px;flex:none}
.gap span{font-size:12px;line-height:1.5}.wakeline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.wakebtn{border:0;background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}
table.wk tr.wkr td,table.wk tr.wkr th{border-top:0;font-weight:400}.wknav{display:flex;gap:6px;align-items:center;margin:0 0 10px}
.wknav button{flex:none;border:0;background:var(--card);color:var(--ink);border-radius:10px;height:38px;min-width:38px;padding:0 10px;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.wknav button:disabled{opacity:.35;cursor:default}
.wknav button.now{background:var(--brand);color:#fff;font-weight:700}
.wknav select{flex:1;min-width:0;height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 10px;font-size:13px;font-family:inherit}.wknav button.xl{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ink);font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin-bottom:8px;background:var(--bg);border-radius:12px;font-size:14px;cursor:pointer}
.opt input{margin-top:3px;flex:none}
.opt small{display:block;color:var(--sub);font-size:11px;margin-top:2px}.daterow{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.daterow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:13px;font-family:inherit}
.achip{border:1.5px solid var(--ac);background:transparent;color:var(--ink);border-radius:16px;padding:6px 11px;font-size:12px;cursor:pointer}
.achip.on{background:var(--ac);color:#fff}
.chips.nowrap.sub-row{margin-top:6px;align-items:center}
.chips.nowrap .achip{flex:none;opacity:1}
.addact,.addrow{display:flex;gap:6px;flex:none}
.addrow{margin:12px 0 4px}
.addact input,.addrow input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:12px;width:120px;min-width:0}
.addrow input{flex:1;width:auto;border-radius:12px;padding:10px 12px;font-size:13px}
.addact button,.addrow button{border:0;border-radius:16px;background:var(--brand);color:#fff;padding:6px 12px;font-size:12px;cursor:pointer}
.addrow button{border-radius:12px}
.slot .ct{gap:8px;overflow:hidden;white-space:nowrap}
.slot .cn{font-size:11px;color:var(--sub);flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis}
.slot .an{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.sumrow{padding:6px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.sumrow .t{display:flex;gap:6px;font-size:13px;margin-bottom:2px}
.sumrow .t b,.sumrow .t span.sub{}
.sumrow .t span.sub{margin-left:auto}
.sumrow .t.sm{padding-left:18px;font-size:12px;color:var(--ink)}
.tag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg);color:var(--sub)}
.tag.ok{background:#dff5ea;color:#1b7a50}
</style>
</head>
<body>
<div id="app">
<header><div><h1 id="ttl">오늘</h1><p id="sbt"></p></div><button id="gear" title="설정" aria-label="설정" onclick="openSettings()">⚙️</button></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<script src="data.js" onerror="void 0"></script>
<script>
// 엑셀
// 엑셀 '목표 25' 시트 Effective @ 260901 블록의 실제 값
const CATS=[
 // 처음 3개: 초록 / 중간 8개: 주황 / 마지막 3개: 살색
 ["산책 & 반트",15,"#2b8a3e",12.5],["home routine",2,"#40a35a",2.5],["Soul, 건강/운동 공부",6,"#74b816",5],
 ["몰입 / 명상",4,"#c2410c",4.5],["coaching/강의/Edge&",6,"#d9480f",3],["AiE",10,"#e8590c",11.5],
 ["Biz",4,"#f76707",5],["Investment",4,"#fd7e14",2],["Smart/유튜버/writing/독서",4,"#e67700",4],
 ["Gtr연습/Art/Music",2,"#f08c00",1],["Creative/여행plan/외국어",3,"#ff9f43",3.5],
 ["정리정돈/News",3,"#d9a07f",2],["3R",6,"#c68b6b",4],["FamDay",7,"#b07556",7.5]
];
// 마지막 값 = 이번 주 실제(샘플). 실제 앱에서는 time_entry 합계
const TOTAL=CATS.reduce((a,c)=>a+c[1],0);
// 멍(아무것도 안 하는 시간)은 엑셀에서도 따로 기록하는 항목. 목표 합계(TOTAL)에는 넣지 않고 기록용으로만 추가
const MEONG=["멍",0,"#f3e2b3",0];
const REC=[...CATS,MEONG];
const PSEUDO=[["수면","#0C0C0C"],["기상","#7F7F7F"],["시안","#00FFFF"],["분홍","#FFCCFF"],["기타","#E0E0E0"]]; // 엑셀 그리드의 색 칸 중 카테고리가 아닌 것 (코드 -1~-5)
const color=n=>REC.find(c=>c[0]===n)?.[2]||PSEUDO.find(p=>p[0]===n)?.[1]||"#999";
// ── 엑셀에서 가져온 실제 기록(data.js, 개인 데이터라 GitHub에는 없음). 없으면 예시 데이터로 동작 ──
const HAS_REAL=!!(window.TC_DATA&&TC_DATA.days);
const REAL_DAY={},REAL_MARK=(HAS_REAL&&TC_DATA.marks)||{};
if(HAS_REAL){
 const map=TC_DATA.cats.map(n=>REC.findIndex(c=>c[0]===n));
 Object.entries(TC_DATA.days).forEach(([k,arr])=>{const v=REC.map(()=>0);arr.forEach((n,i)=>{if(map[i]>=0)v[map[i]]+=n});REAL_DAY[k]=v});
}
// 카테고리는 엑셀 행 순서(위치) 기준 15개(14개 + 멍). 이름은 시기(Effective)마다 다를 수 있어 시기별 이름을 따로 둔다 (이름으로 합치거나 바꾸지 않음)
// 목표는 엑셀 '목표 25' 시트의 블록 그대로: 250101 / 260101 / 260901. 위치 5번은 독서/배움 → 260901부터 AiE, 8번은 Smart/유튜버/writing → Smart/유튜버/writing/독서/배움
const N2601=["산책 & 반트","home routine","Soul, 건강/운동 공부","몰입 / 명상","coaching/강의/Edge&","독서 / 배움","Biz","Investment","Smart/유튜버/writing","Gtr연습/Art/Music","Creative/여행plan/외국어","정리정돈/News","3R","FamDay"];
const GOALSETS=[
 {from:"2000-01-01",label:"250101",names:N2601,g:[13,3,7,4,6,9,6,4,3,2,3,3,6,7]},
 {from:"2026-01-01",label:"260101",names:N2601,g:[15,2,6,4,6,9,6,4,3,2,3,3,6,7]},
 {from:"2026-09-01",label:"260901",names:CATS.map(c=>c[0]),g:CATS.map(c=>c[1])}
];
const setAt=u=>{const k=toS(u);let g=GOALSETS[0];GOALSETS.forEach(s=>{if(s.from<=k)g=s});return g};
const goalAt=(name,u)=>{const i=CATS.findIndex(c=>c[0]===name);return i<0?0:setAt(u).g[i]||0}; // 이름은 현재 이름 → 위치로 바꿔서 그 시기의 목표를 찾음
// 기간 [a,b] 안에서 위치 i의 이름들(중간에 이름이 바뀌었으면 여러 개)
function namesIn(i,a,b){
 if(i>=CATS.length)return ["멍"];
 const out=[],ka=toS(a),kb=toS(b);
 GOALSETS.forEach((s,n)=>{const end=n+1<GOALSETS.length?GOALSETS[n+1].from:"9999-12-31";if(s.from<=kb&&end>ka){const nm=s.names[i];if(out[out.length-1]!==nm)out.push(nm)}});
 return out;
}
const labelIn=(i,a,b)=>namesIn(i,a,b).join(" → ");
// ── 시간대별 기록(엑셀 그리드): 4:30부터 15분 칸 단위. 지난 날짜는 읽기 전용으로 보여줌 ──
const SLOT_CACHE={};
function realSlots(ds){
 if(SLOT_CACHE[ds])return SLOT_CACHE[ds];
 const raw=HAS_REAL&&TC_DATA.slots&&TC_DATA.slots[ds];if(!raw)return null;
 const m={};
 raw.forEach(([s,u,c,tx])=>{const name=c>=0?REC[c][0]:PSEUDO[-c-1][0];for(let n=0;n<u;n++){const mm=s+15*n,k=Math.floor(mm/60)*100+mm%60;if(k>=430&&k<2400)m[k]={c:name,a:tx||""}}});
 return SLOT_CACHE[ds]=m;
}
// ── 기상시간: 집계 카테고리가 아니라 날짜별로 따로 기록 (엑셀의 '기상' 칸 시각 + 앱에서 입력한 값). 앱 입력이 우선 ──
let WAKE_USER={};
try{WAKE_USER=JSON.parse(localStorage.getItem("tc-wake")||"{}")||{}}catch(e){}
const saveWakeStore=()=>{try{localStorage.setItem("tc-wake",JSON.stringify(WAKE_USER))}catch(e){}};
const wakeMin=ds=>{ // 분(자정부터). 없으면 null
 const u=WAKE_USER[ds];
 if(u)return u.t?(+u.t.split(":")[0])*60+(+u.t.split(":")[1]):null;
 const w=HAS_REAL&&TC_DATA.wake&&TC_DATA.wake[ds];return w==null?null:w;
};
const wakeMark=ds=>(WAKE_USER[ds]&&WAKE_USER[ds].m!=null?WAKE_USER[ds].m:REAL_MARK[ds])||"";
const fmtMin=m=>{if(m==null)return "";m=Math.round(m);return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const fmtHm=m=>{if(m==null)return "";m=Math.round(m);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0")};
const wakeAvg=list=>{const v=list.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const grid={}; // slot -> cat
if(!HAS_REAL)[[630,"몰입 / 명상"],[700,"Soul, 건강/운동 공부"],[730,"Soul, 건강/운동 공부"],[800,"산책 & 반트"],[830,"산책 & 반트"],[900,"AiE"],[930,"AiE"],[1000,"AiE"],[1030,"Biz"],[1100,"Biz"],[1300,"Investment"],[1330,"Smart/유튜버/writing/독서"],[1400,"coaching/강의/Edge&"]].forEach(([k,v])=>grid[k]=v);
// 카테고리 아래 세부 activity (엑셀 주간 시트의 입력 표기에서 가져온 예시). 직접 입력하면 목록에 추가됨
const SUBS={
 "산책 & 반트":["산책","반트","걷기"],
 "home routine":["roborock","wash","약 정리","공과금"],
 "Soul, 건강/운동 공부":["운동","스트레칭","건강공부","Ski"],
 "몰입 / 명상":["60 몰입","명상","Note 몰입"],
 "coaching/강의/Edge&":["코칭공부","강의듣기","Edge&"],
 "AiE":["AiE 공부","프롬프트 실습","앱 개발"],
 "Biz":["audit read","IESBA","timesheet"],
 "Investment":["cashflows","25 yearly","투자검토"],

 <div class="sub" style="margin-top:8px">${HAS_REAL?"지난 날짜는 엑셀에서 가져온 실제 기록이고":"지난 날짜는 예시 데이터이고"}, 오늘은 오늘 탭의 기록이 반영돼요. 목표는 주마다 휴일(주말 포함 3일 이상이면 추가 휴일은 50%)과 멍 시간을 반영한 값이에요.</div>`;
}
const g2={};CATS.forEach(c=>g2[c[0]]=c[1]);
function renderGoals(){
 $("#sbt").textContent="Effective @ 260901 (개정 이력 관리)";
 const t=Object.values(g2).reduce((a,b)=>a+b,0);
 return `<div class="card"><h2>현재 목표 <span class="sub">합계 ${t}h · 연 ${t*52}h</span></h2>
 ${CATS.map(c=>`<div class="goalrow"><span style="width:10px;height:10px;border-radius:3px;background:${c[2]}"></span><span>${c[0]}<div class="sub">${(g2[c[0]]/t*100).toFixed(1)}% · 연 ${g2[c[0]]*52}h</div></span><div class="step"><button onclick="adj('${c[0]}',-1)">−</button><b>${g2[c[0]]}</b><button onclick="adj('${c[0]}',1)">+</button></div></div>`).join("")}
 <button class="btn">새 Effective 날짜로 개정 저장</button></div>
 <div class="card"><h2>개정 이력</h2>${[["260901","AiE 신설, 76h"],["260101","독서/배움 9h, Biz 6h"],["250101","주간 목표 개정"],["240101","이제 백만장자로서 살아야 한다"]].map(h=>`<div class="li"><div class="ic">🗓️</div><div>Effective @ ${h[0]}<small>${h[1]}</small></div></div>`).join("")}</div>`;
}
function adj(n,d){g2[n]=Math.max(0,g2[n]+d);render()}

function renderMore(){
 $("#sbt").textContent="데이터 연동 · 가져오기 · 내보내기";
 return `<div class="card"><h2>데이터 연동</h2>
 <div class="li"><div class="ic">👟</div><div>Health Connect (구글 피트니스)<small>오늘 8,240보 · 10분 전 동기화</small></div><span class="tag ok">연결됨</span></div>
 <div class="li"><div class="ic">🥗</div><div>뱅크샐러드<small>내보내기 파일(xlsx/CSV) 가져오기</small></div><span class="tag">파일 선택</span></div></div>
 <div class="card"><h2>엑셀</h2>
 <div class="li"><div class="ic">📥</div><div>엑셀 가져오기<small>${HAS_REAL?`2026 time cruise (1).xlsx에서 가져옴 · ${Object.keys(TC_DATA.days).length}일 (${Object.keys(TC_DATA.days)[0]} ~ ${Object.keys(TC_DATA.days).slice(-1)[0]})`:"2026 time cruise.xlsx · 목표 + 주간 29장"}</small></div></div>
 <div class="li"><div class="ic">📤</div><div>엑셀 내보내기<small>기존 레이아웃 그대로 .xlsx</small></div></div></div>
 <div class="card"><h2>이번 달 지출 (뱅크샐러드)</h2>${[["식비",412000,60],["교통",98000,14],["여가/문화",156000,23],["투자/저축",900000,100]].map(r=>`<div class="row"><div class="t"><span>${r[0]}</span><b>${r[1].toLocaleString()}원</b></div><div class="bar"><i style="width:${r[2]}%;background:var(--brand)"></i></div></div>`).join("")}<div class="sub">샘플 데이터</div></div>`;
}

// ── 설정창 (헤더의 ⚙️) ──
function openSettings(){
 $("#sheetBody").innerHTML=`<h2 style="font-size:16px;margin-bottom:12px">설정</h2>
 <label class="fld"><span>생년월일</span><input type="date" id="sBirth" value="${cfg.birth}" oninput="checkSettings()"><small>살아온 날과 살아갈 날(100세 기준) 계산에 써요</small></label>
 <label class="fld"><span>해당연도 시작일</span><input type="date" id="sStart" value="${cfg.start}" oninput="checkSettings()"></label>
 <label class="fld"><span>해당연도 끝일</span><input type="date" id="sEnd" value="${cfg.end}" oninput="checkSettings()"><small>주 단위로 기록하므로 시작일부터 끝일까지가 7일의 배수여야 해요</small></label>
 <div class="sub" id="sInfo" style="margin-bottom:4px"></div><div class="errmsg" id="sErr"></div>
 <button class="btn" id="sSave" onclick="saveSettings()">저장</button>
 <button class="btn g" id="sFix" onclick="fixEnd()" hidden>끝일을 7일 단위로 맞추기</button>
 <button class="btn g" onclick="resetSettings()">엑셀 기본값으로</button>`;
 $("#sheet").classList.add("show");checkSettings();
}
const readSettings=()=>({birth:$("#sBirth").value,start:$("#sStart").value,end:$("#sEnd").value});
function validateCfg(c){
 const b=toU(c.birth),s=toU(c.start),e=toU(c.end),n=new Date(),t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
 if(isNaN(b)||isNaN(s)||isNaN(e))return {err:"날짜를 모두 입력해 주세요."};
 if(b>=t)return {err:"생년월일은 오늘보다 이전이어야 해요."};
 if(e<=s)return {err:"끝일은 시작일보다 뒤여야 해요."};
 const nd=(e-s)/DAY+1;
 if(nd%7)return {err:`주 단위 기록이라 기간이 7일의 배수여야 해요. 지금은 ${nd}일이에요.`,fix:s+Math.max(1,Math.round(nd/7))*7*DAY-DAY};
 return {ok:true,nd,weeks:nd/7,s,e};
}
function checkSettings(){
 const v=validateCfg(readSettings());
 $("#sSave").disabled=!v.ok;$("#sSave").style.opacity=v.ok?1:.45;
 $("#sErr").textContent=v.err||"";
 $("#sFix").hidden=!v.fix;$("#sFix").dataset.fix=v.fix?toS(v.fix):"";
 $("#sInfo").textContent=v.ok?`${WD[new Date(v.s).getUTCDay()]}요일 시작 ~ ${WD[new Date(v.e).getUTCDay()]}요일 끝 · ${v.weeks}주 (${v.nd}일)`:"";
}
function fixEnd(){$("#sEnd").value=$("#sFix").dataset.fix;checkSettings()}
function saveSettings(){
 const c=readSettings();if(!validateCfg(c).ok)return;
 cfg=c;try{localStorage.setItem("tc-settings",JSON.stringify(cfg))}catch(e){}
 holMap={};viewWk=null;closeSheet();day=todayInfo().sel;render();toast("설정을 저장했어요");
}
function resetSettings(){
 $("#sBirth").value=DEFAULT_CFG.birth;$("#sStart").value=DEFAULT_CFG.start;$("#sEnd").value=DEFAULT_CFG.end;checkSettings();
}

const TABS=[["today","오늘","🕒",renderToday,"오늘"],["dash","대시보드","📊",renderDash,"대시보드"],["detail","세부data","📋",renderDetail,"대시보드 세부data"],["goal","목표","🎯",renderGoals,"목표 관리"],["more","연동","⚙️",renderMore,"연동 / 엑셀"]];
function render(){
 const t=TABS.find(x=>x[0]===tab);$("#ttl").textContent=t[4];$("#main").innerHTML=t[3]();
 $("#nav").innerHTML=TABS.map(x=>`<button class="${x[0]===tab?"on":""}" onclick="tab='${x[0]}';render()"><b>${x[2]}</b>${x[1]}</button>`).join("");
}
// 앱을 열어 둔 채 날짜가 바뀌면(자정 이후 다시 열 때) 오늘 날짜로 갱신
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible"&&todayInfo().full!==curDay){curDay=todayInfo().full;day=todayInfo().sel;render()}
});
render();
</script>
